services:
  pi-dashboard:
    image: ${IMAGE:-ghcr.io/javidahmed64592/pi-dashboard:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-dashboard
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - NGINX_PROXY_URL=${NGINX_PROXY_URL:-}
      - HOST_ROOT=/host
    volumes:
      - ./.env:/app/.env
      - ./logs:/app/logs
      - ./data:/app/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
      # Mount Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
